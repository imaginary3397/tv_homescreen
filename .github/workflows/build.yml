name: Bygg appen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bygg apk
        run: ./gradlew assembleRelease --stacktrace

      - name: Döp om filen
        run: cp app/build/outputs/apk/release/app-release.apk startskarm.apk

      - name: Publicera som nedladdning
        uses: softprops/action-gh-release@v2
        with:
          tag_name: senaste
          name: Senaste versionen
          body: Bygg ${{ github.run_number }} från ${{ github.sha }}
          files: startskarm.apk
          make_latest: true
